<!-- Cena 2/3: vídeo real do corte da fita, revelado por uma íris dourada -->
<div class="stage" aria-hidden="true">
  <video
    #video
    class="video"
    muted
    playsinline
    preload="auto"
    disablepictureinpicture
    disableremoteplayback
    poster="media/opening/opening-poster.webp"
    [style.object-position]="scene() === 'close' ? '30% 50%' : '50% 50%'"
    (canplay)="onCanPlay()"
  >
    <source [src]="base + '.mp4'" type="video/mp4" />
    <source [src]="base + '.webm'" type="video/webm" (error)="onVideoError()" />
  </video>
  <div class="vignette"></div>
  <div class="flash"></div>
</div>
<div class="ring" aria-hidden="true"></div>

<!-- Cena 1: marca sobre marfim -->
<div class="logo" aria-hidden="true">
  <div class="logo__mark">
    <img src="brand/monogram.svg" alt="" width="448" height="448" />
    <span class="logo__sheen"></span>
  </div>
  <span class="logo__rule"></span>
  <p class="logo__name">Studio Monique Marques</p>
</div>

<!-- Cena 4: dissolve em marfim -->
<div class="veil" aria-hidden="true"></div>

<button #skipBtn type="button" class="skip" (click)="skip()">
  Pular abertura
  <svg class="skip__arrow" viewBox="0 0 18 10" width="18" height="10" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
    <path d="M0 5h16M12 1l4 4-4 4" />
  </svg>
</button>
