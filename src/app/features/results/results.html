@if (visible) {
  <section id="resultados" class="section results" aria-labelledby="results-title">
    <div class="container results__grid">
      <header class="results__head reveal" smmReveal>
        <h2 id="results-title" class="title">{{ copy.title }}</h2>
        <p class="text-2">{{ copy.intro }}</p>
        @if (showPlaceholder) {
          <p class="todo-note">
            <strong>Placeholder:</strong> ainda não há fotos de clientes. O comparador ao lado já funciona; falta só o par
            de fotos reais.
          </p>
        }
      </header>

      @if (showPlaceholder) {
        <div class="results__demo reveal" smmReveal>
          <smm-before-after />
        </div>
      } @else {
        <ul class="results__list">
          @for (item of items; track $index) {
            <li class="reveal" smmReveal>
              <figure>
                @if (item.kind === 'before-after') {
                  <smm-before-after [before]="item.before" [after]="item.after" />
                } @else {
                  <div class="photo results__photo">
                    <img [src]="item.image.src" [alt]="item.image.alt" loading="lazy" decoding="async" />
                  </div>
                }
                @if (item.caption) {
                  <figcaption class="results__caption">{{ item.caption }}</figcaption>
                }
              </figure>
            </li>
          }
        </ul>
      }
    </div>
  </section>
}
