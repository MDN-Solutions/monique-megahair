<section id="inicio" class="hero" aria-labelledby="hero-title">
  <div class="container hero__inner">
    <!-- Nome da marca em tamanho de cartaz, atrás da foto (referência: GESTWŁOSY / SHEAR) -->
    <p class="hero__giant enter" aria-hidden="true">
      <span>Monique</span><span>Marques</span>
    </p>

    <div class="hero__photo photo">
      <img
        [src]="hero.image.src"
        [alt]="hero.image.alt"
        width="864"
        height="1080"
        fetchpriority="high"
        decoding="async"
      />
    </div>

    <div class="hero__copy">
      <h1 id="hero-title" class="hero__title serif enter" style="--i: 1">
        {{ hero.title }}
        <smm-scribble>{{ hero.highlight }}</smm-scribble>
      </h1>
      <p class="hero__sub text-2 enter" style="--i: 2">{{ hero.subtitle }}</p>
      <div class="hero__cta enter" style="--i: 3">
        <a
          class="btn btn--dark"
          [href]="wa"
          [attr.target]="waExternal ? '_blank' : null"
          [attr.rel]="waExternal ? 'noopener' : null"
        >
          Agendar pelo WhatsApp
        </a>
      </div>
    </div>

    <div class="hero__side enter" style="--i: 4">
      @if (city) {
        <p class="pill"><smm-icon name="pin" style="--icon-size: 1rem" />{{ city }}</p>
      }
      <button type="button" class="filmcard" (click)="openFilm()">
        <span class="filmcard__thumb">
          <img [src]="film.thumb" alt="" width="600" height="720" decoding="async" />
          <span class="filmcard__play"><smm-icon name="play" style="--icon-size: 0.9rem" /></span>
        </span>
        <span class="filmcard__text">
          <span class="filmcard__title">Assista à inauguração</span>
          <span class="filmcard__meta">Vídeo · {{ film.duration }}</span>
        </span>
      </button>
    </div>
  </div>
</section>
