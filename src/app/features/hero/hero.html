<section id="inicio" class="hero" aria-labelledby="hero-title">
  <div class="hero__glow" aria-hidden="true"></div>

  <div class="container hero__inner">
    <div class="hero__copy">
      <p class="eyebrow enter" style="--i: 0">{{ hero.eyebrow }}</p>

      <h1 id="hero-title" class="hero__title">
        @for (line of hero.lines; track line; let i = $index) {
          <span class="hero__line"><span class="hero__line-in" [style.--i]="i">{{ line }}</span></span>
        }
        <span class="hero__line">
          <span class="hero__line-in gold" [style.--i]="hero.lines.length">{{ hero.accentLine }}</span>
        </span>
      </h1>

      <p class="lead hero__sub enter" style="--i: 4">{{ hero.subtitle }}</p>

      <div class="hero__cta enter" style="--i: 5">
        <a
          class="btn btn--primary"
          [href]="wa"
          [attr.target]="waExternal ? '_blank' : null"
          [attr.rel]="waExternal ? 'noopener' : null"
        >
          Agendar pelo WhatsApp
          <svg class="btn__arrow" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
            <path d="M0 5h16M12 1l4 4-4 4" />
          </svg>
        </a>
        <a class="btn btn--ghost" href="#sobre">Conhecer o estúdio</a>
      </div>
    </div>

    <div class="hero__media">
      <div class="arch enter" style="--i: 2">
        <div class="arch__media hero__frame">
          <img
            [src]="hero.image.src"
            [alt]="hero.image.alt"
            width="864"
            height="1080"
            fetchpriority="high"
            decoding="async"
          />
        </div>
      </div>
    </div>
  </div>
</section>
