<section id="inicio" class="hero" aria-labelledby="hero-title">
  <smm-strands class="hero__strands" />
  <smm-strands class="hero__strands hero__strands--right" />
  <div class="hero__copy">
    <p class="eyebrow enter" style="--i: 0">{{ hero.eyebrow }}</p>

    <h1 id="hero-title" class="hero__title enter" style="--i: 1">
      @for (line of lines; track line) {
        <span class="hero__line">{{ line }}</span>
      }
    </h1>

    <p class="hero__sub enter" style="--i: 2">{{ hero.subtitle }}</p>

    <div class="hero__cta enter" style="--i: 3">
      <a
        class="btn btn--primary"
        [href]="wa"
        [attr.target]="waExternal ? '_blank' : null"
        [attr.rel]="waExternal ? 'noopener' : null"
      >
        Agendar pelo WhatsApp
      </a>
    </div>
  </div>
</section>
